services:
  postgres:
    image: postgres:16-alpine
    container_name: pp-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no Zookeeper).
  # It is both broker and controller — fine for local dev, never for prod.
  kafka:
    image: apache/kafka:3.9.0
    container_name: pp-kafka
    ports:
      - "29092:29092"        # host -> broker (your Python code uses this)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # Three listeners: one for other containers, one for the host, one for the
      # internal controller (Raft) traffic.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single node, so nothing can be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Kafka defaults to a 1 GB JVM heap it does not need at this scale.
      # Capped because the dev machine has 8 GB total and Docker Desktop,
      # Postgres and Redis all want a slice of it.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Opt-in: `docker compose --profile ui up -d`. It is a second JVM, so it stays
  # off by default. Without it, inspect topics from inside the broker container:
  #   docker exec pp-kafka /opt/kafka/bin/kafka-console-consumer.sh \
  #     --bootstrap-server localhost:9092 --topic payments.payment.v1 --from-beginning
  kafka-ui:
    profiles: ["ui"]
    image: provectuslabs/kafka-ui:latest
    container_name: pp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  # Opt-in: `docker compose --profile observability up -d`. Off by default —
  # this dev machine has 8GB total, already spent on Postgres, Redis, and a
  # heap-capped Kafka. Prometheus and Grafana are both small Go binaries (not
  # another JVM), but two more always-on services is still real memory
  # pressure for a milestone whose point — seeing the four ADR 0007 metrics —
  # only needs them running for as long as a demo takes, not all the time.
  #
  # The API, relay, and worker run on the HOST (`make api`/`relay`/`worker`),
  # not in this compose stack, so Prometheus scrapes them via Docker
  # Desktop's host.docker.internal — see observability/prometheus/prometheus.yml.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: pp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # prometheus.yml's rule_files: [alerts.yml] resolves relative to
      # /etc/prometheus/ inside the container — without this mount,
      # Prometheus starts and loads its config successfully (no error) but
      # silently has zero alert rules, which is a much easier bug to miss
      # than a startup failure would have been.
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # This project's own retention discipline (app/services/retention.py)
      # doesn't apply here — this is scrape data for a live demo, not an
      # audit trail. 2h is plenty and keeps the volume-less container's disk
      # use bounded without needing a named volume for a profile that's off
      # by default anyway.
      - --storage.tsdb.retention.time=2h

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    container_name: pp-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin, no login screen: this is a localhost-only dev
      # profile behind no public port forwarding, not a shared environment —
      # the tradeoff real auth (ADR 0007 Decision 4) is about doesn't apply
      # to a single-developer laptop's own Grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  pgdata:
