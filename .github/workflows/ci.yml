name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # These deliberately need no database and no Kafka, which is why they
        # run in ~2 seconds on every push. Integration tests against the real
        # compose stack land in M3 as a separate, slower job.
        run: pytest -q
