[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
# Plain `pytest -q` (the fast CI job) must stay infra-free, so integration
# tests are opted OUT by default here rather than relying on every invoker to
# remember `-m "not integration"`. Run them explicitly with `pytest -m
# integration` (needs `docker compose up -d postgres`, migrated and seeded).
addopts = '-m "not integration"'
markers = [
    "integration: needs the compose stack (Postgres) up, migrated, and seeded",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are generated and conventionally left unlinted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. For FastAPI that IS the
# dependency-injection idiom, not a bug, so these callables are exempted
# rather than the whole rule being switched off.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]
